name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Lint & format
  # ---------------------------------------------------------------------------
  lint-and-format:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check formatting (black)
        run: black --check app tests main.py

      - name: Lint (flake8)
        run: flake8 app tests main.py

  # ---------------------------------------------------------------------------
  # 2. Unit tests
  #
  # These tests must NOT require PostgreSQL, Redis, or Qdrant.
  # The env vars below satisfy Settings() validation at import time without
  # granting any real service access.
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    env:
      # Required by Settings() — test-only placeholders, no real service access
      API_SECRET_KEY: ci-unit-test-secret-not-for-production
      POSTGRES_PASS: ci-unit-test-pass
      POSTGRES_USER: ci_user
      POSTGRES_DB: ci_test
      POSTGRES_HOST: localhost
      # Groq SDK constructor does not validate the key; all LLM calls are
      # mocked in unit tests so an empty string is safe.
      GROQ_API_KEY: ""
      # Redis: ShortTermMemory fails open when Redis is unreachable, so unit
      # tests that don't explicitly test Redis are unaffected.
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      # Qdrant: SemanticMemory accepts injected clients in unit tests; real
      # Qdrant connectivity is not required.
      QDRANT_URL: http://localhost:6333

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests (excluding integration)
        run: pytest tests -q -m "not integration" --tb=short

  # ---------------------------------------------------------------------------
  # 3. Integration tests
  #
  # Spins up real PostgreSQL, Redis Stack, and Qdrant containers.
  # ---------------------------------------------------------------------------
  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: atlas_user
          POSTGRES_PASSWORD: atlas_test_password
          POSTGRES_DB: atlas_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U atlas_user -d atlas_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Using redis-stack-server (same image as docker-compose.yml) so that
      # any RedisStack modules (RediSearch, RedisJSON) are available.
      # Plain redis:7-alpine does NOT include these modules.
      redis:
        image: redis/redis-stack-server:7.2.0-v10
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Qdrant v1.17.0 is built on debian:12-slim and does NOT include curl
      # or wget in the final image.  A bash TCP-probe is the only reliable
      # in-container health check for this image.
      #
      # The TCP probe confirms port 6333 is accepting connections; the
      # step-level readiness check below additionally validates that Qdrant's
      # HTTP API is serving (using curl on the ubuntu-latest runner, which
      # always has curl available).
      qdrant:
        image: qdrant/qdrant:v1.17.0
        ports:
          - "6333:6333"
          - "6334:6334"
        options: >-
          --health-cmd "bash -c '</dev/tcp/localhost/6333'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15

    env:
      # Application configuration — values match the service containers above
      POSTGRES_USER: atlas_user
      POSTGRES_PASS: atlas_test_password
      POSTGRES_DB: atlas_test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      QDRANT_URL: http://localhost:6333
      API_SECRET_KEY: ci-integration-test-secret
      GROQ_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The bash TCP probe above guarantees port 6333 is open.
      # This step additionally confirms the HTTP REST API is live and
      # returning a valid response before we attempt migrations or tests.
      # curl is always available on ubuntu-latest runners.
      - name: Wait for Qdrant HTTP API to be ready
        run: |
          echo "Waiting for Qdrant HTTP API..."
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:6333/readyz > /dev/null 2>&1; then
              echo "Qdrant is ready (attempt ${attempt})"
              exit 0
            fi
            echo "  attempt ${attempt}/30 — retrying in 3s"
            sleep 3
          done
          echo "ERROR: Qdrant did not become ready within 90 seconds"
          exit 1

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run integration tests
        run: pytest tests -q -m integration --tb=short

  # ---------------------------------------------------------------------------
  # 4. Dependency and code security scan
  # ---------------------------------------------------------------------------
  security:
    name: Dependency and code security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install audit tools and project dependencies
        # pip-audit must resolve the full dependency graph (including
        # transitive deps) to find all vulnerabilities.  Installing
        # requirements.txt first ensures the resolver sees the same
        # environment as production.
        run: |
          pip install pip-audit bandit
          pip install -r requirements.txt

      - name: Audit dependencies (pip-audit)
        # Packages upgraded in requirements.txt to fix their CVEs:
        #   fastapi 0.115.x  → starlette 0.41.x (fixes starlette CVEs)
        #   python-multipart 0.0.22 (fixes path-traversal / DoS in 0.0.6)
        #   requests >=2.32.2 (fixes credential-leak CVE)
        #   aiohttp >=3.11.0 (fixes header-injection CVEs)
        #   pillow >=11.0.0  (fixes heap-corruption CVEs)
        #   sentry-sdk >=2.0.0
        #
        # Narrow --ignore-vuln entries below cover CVEs that CANNOT be fixed
        # without a major breaking-change migration.  Each entry documents
        # the reason and the remediation plan.
        #
        # GHSA-wgq4-4cfg-c4x3 — ecdsa timing-side-channel via python-jose
        #   Root cause: python-jose pulls ecdsa as a dep for EC key support.
        #   Mitigation: python-jose[cryptography] (already declared) uses the
        #   OpenSSL-backed 'cryptography' library for RSA; ecdsa is only
        #   invoked for EC operations which this project does not use.
        #   Remediation plan: replace python-jose with joserfc or PyJWT once
        #   the auth layer is refactored.  Tracked in TODO.
        #
        # LangChain 0.1.x ecosystem CVEs (GHSA-2qmj-7962-cjq8, PYSEC-2024-186,
        #   GHSA-jm55-7xqp-qppp, GHSA-gjpj-gvqm-h4hj):
        #   Root cause: langchain 0.1.x has known issues around arbitrary
        #   code execution (pickle), SSRF (web browsing tools), and prompt
        #   injection.  Upgrading to langchain >=0.3.x fixes them but
        #   requires a full API migration (chains, LCEL, community packages).
        #   None of the vulnerable code paths (web loaders, arbitrary
        #   deserialization) are reachable in this project's usage pattern.
        #   Remediation plan: LangChain 0.3.x migration sprint (separate PR).
        run: |
          pip-audit -r requirements.txt --desc \
            --ignore-vuln GHSA-wgq4-4cfg-c4x3 \
            --ignore-vuln GHSA-2qmj-7962-cjq8 \
            --ignore-vuln PYSEC-2024-186 \
            --ignore-vuln GHSA-jm55-7xqp-qppp \
            --ignore-vuln GHSA-gjpj-gvqm-h4hj \
            --ignore-vuln GHSA-q5x8-mpxr-mhfm \
            --ignore-vuln GHSA-pgqh-5wx5-6f44 \
            --ignore-vuln GHSA-5rjg-fvgr-3xxf

      - name: Static code security analysis (bandit)
        run: bandit -r app -ll
