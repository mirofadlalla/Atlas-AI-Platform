name: Backend Delivery

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/atlas-ai

jobs:
  build-scan-push:
    name: Build, scan, and publish image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
      # The short tag used for the Trivy scan (local daemon image)
      local_tag: ${{ steps.local_tag.outputs.local_tag }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generate consistent tags for this commit
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=latest

      # Build and load into the local Docker daemon for Trivy scanning.
      # We use a deterministic local tag so the Trivy step can reference it
      # reliably without depending on the registry path (which isn't pushed yet).
      - name: Set local image tag
        id: local_tag
        run: echo "local_tag=atlas-ai-local:sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build image (load to local daemon for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.local_tag.outputs.local_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scan the locally-loaded image.
      # image-ref uses the local tag (not the registry path) because the image
      # has not been pushed yet.  Using the registry path here would cause Trivy
      # to attempt a remote pull which fails before push.
      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.local_tag.outputs.local_tag }}
          format: table
          exit-code: "0"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      # Only push after the security scan passes
      - name: Push image to registry
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image ref for downstream jobs
        id: image
        run: echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Staging deploy and smoke test
  # ---------------------------------------------------------------------------
  staging:
    name: Deploy staging and smoke test
    needs: build-scan-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Deploy image to staging
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ secrets.STAGING_USER }}
          DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
          IMAGE: ${{ needs.build-scan-push.outputs.image }}
        run: |
          set -eu
          test -n "$HOST" && test -n "$USER" && test -n "$DEPLOY_PATH"
          ssh -o StrictHostKeyChecking=accept-new "$USER@$HOST" \
            "cd '$DEPLOY_PATH' && ATLAS_IMAGE='$IMAGE' docker compose pull api celery_worker celery_beat && ATLAS_IMAGE='$IMAGE' docker compose up -d --no-build api celery_worker celery_beat"

      - name: Smoke test staging
        env:
          URL: ${{ secrets.STAGING_HEALTH_URL }}
        run: |
          set -eu
          test -n "$URL"
          curl --fail --retry 10 --retry-delay 6 "$URL/health"

  # ---------------------------------------------------------------------------
  # Production deploy (requires manual approval via GitHub environment)
  # ---------------------------------------------------------------------------
  production:
    name: Production approval and deploy
    needs: [build-scan-push, staging]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_SSH_KEY }}

      - name: Deploy approved image
        env:
          HOST: ${{ secrets.PRODUCTION_HOST }}
          USER: ${{ secrets.PRODUCTION_USER }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
          IMAGE: ${{ needs.build-scan-push.outputs.image }}
        run: |
          set -eu
          test -n "$HOST" && test -n "$USER" && test -n "$DEPLOY_PATH"
          ssh -o StrictHostKeyChecking=accept-new "$USER@$HOST" \
            "cd '$DEPLOY_PATH' && ATLAS_IMAGE='$IMAGE' docker compose pull api celery_worker celery_beat && ATLAS_IMAGE='$IMAGE' docker compose up -d --no-build api celery_worker celery_beat"

      - name: Smoke test production
        env:
          URL: ${{ secrets.PRODUCTION_HEALTH_URL }}
        run: |
          set -eu
          test -n "$URL"
          curl --fail --retry 10 --retry-delay 6 "$URL/health"