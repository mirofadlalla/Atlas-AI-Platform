name: Backend Delivery

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/atlas-ai

jobs:
  build-scan-push:
    name: Build, scan, and publish image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
      - id: image
        run: echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"

  staging:
    name: Deploy staging and smoke test
    needs: build-scan-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}
      - name: Deploy image to staging
        env:
          HOST: ${{ secrets.STAGING_HOST }}
          USER: ${{ secrets.STAGING_USER }}
          DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
          IMAGE: ${{ needs.build-scan-push.outputs.image }}
        run: |
          test -n "$HOST" && test -n "$USER" && test -n "$DEPLOY_PATH"
          ssh -o StrictHostKeyChecking=accept-new "$USER@$HOST" \
            "cd '$DEPLOY_PATH' && ATLAS_IMAGE='$IMAGE' docker compose pull api celery_worker celery_beat && ATLAS_IMAGE='$IMAGE' docker compose up -d --no-build api celery_worker celery_beat"
      - name: Smoke test staging
        env:
          URL: ${{ secrets.STAGING_HEALTH_URL }}
        run: |
          test -n "$URL"
          curl --fail --retry 10 --retry-delay 6 "$URL/health"

  production:
    name: Production approval and deploy
    needs: [build-scan-push, staging]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_SSH_KEY }}
      - name: Deploy approved image
        env:
          HOST: ${{ secrets.PRODUCTION_HOST }}
          USER: ${{ secrets.PRODUCTION_USER }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
          IMAGE: ${{ needs.build-scan-push.outputs.image }}
        run: |
          test -n "$HOST" && test -n "$USER" && test -n "$DEPLOY_PATH"
          ssh -o StrictHostKeyChecking=accept-new "$USER@$HOST" \
            "cd '$DEPLOY_PATH' && ATLAS_IMAGE='$IMAGE' docker compose pull api celery_worker celery_beat && ATLAS_IMAGE='$IMAGE' docker compose up -d --no-build api celery_worker celery_beat"
      - name: Smoke test production
        env:
          URL: ${{ secrets.PRODUCTION_HEALTH_URL }}
        run: |
          test -n "$URL"
          curl --fail --retry 10 --retry-delay 6 "$URL/health"
