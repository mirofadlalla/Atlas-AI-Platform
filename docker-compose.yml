services:
  # ==================== PostgreSQL Database ====================
  postgres:
    image: postgres:15-alpine
    container_name: atlas-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atlas_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-atlas_db}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"

    expose:
      - "5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-atlas_user} -d ${POSTGRES_DB:-atlas_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - atlas-network

    restart: unless-stopped

  # ==================== Qdrant Vector Database ====================
  qdrant:
    image: qdrant/qdrant:v1.17.0
    container_name: atlas-qdrant

    expose:
      - "6333"
      - "6334"

    volumes:
      - qdrant_data:/qdrant/storage

    networks:
      - atlas-network

    restart: unless-stopped

  # ==================== Redis Cache & Message Broker ====================
  redis:
    image: redis/redis-stack-server:7.2.0-v10
    container_name: atlas-redis

    command:
      redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-atlas_redis_password}

    expose:
      - "6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD:-atlas_redis_password}",
          "ping",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - atlas-network

    restart: unless-stopped

  # ==================== FastAPI Application ====================
  api:
    image: ${ATLAS_IMAGE:-atlas-ai-api:local}
    container_name: atlas-api

    environment:
      PYTHONUNBUFFERED: "1"

      # Run Alembic migrations on API startup only.
      RUN_MIGRATIONS: "true"

      # PostgreSQL
      POSTGRES_USER: ${POSTGRES_USER:-atlas_user}
      POSTGRES_PASS: ${POSTGRES_PASSWORD:-atlas_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-atlas_db}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

      # Qdrant
      QDRANT_URL: http://qdrant:6333

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-atlas_redis_password}

      # Celery broker and result backend
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-atlas_redis_password}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-atlas_redis_password}@redis:6379/1

      # Required secrets
      API_SECRET_KEY: ${API_SECRET_KEY:?Set API_SECRET_KEY in .env}
      # Bootstrap secret for POST /api/super-admin/setup.
      # Leave unset after the first super_admin account is created.
      SUPER_ADMIN_SECRET_KEY: ${SUPER_ADMIN_SECRET_KEY:-}

      # External services
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      JINA_API_KEY: ${JINA_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      REMOTE_EMBED_URL: ${REMOTE_EMBED_URL:-}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}

      # ==================== SMTP / Email ====================
      SMTP_SERVER: ${SMTP_SERVER:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}

      # Embedding provider
      ENVIRONMENT: ${ENVIRONMENT:-production}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-BAAI/bge-m3}

      # Observability
      SENTRY_DSN: ${SENTRY_DSN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEBUG: "${DEBUG:-False}"

    ports:
      - "${API_PORT:-8000}:8000"

    depends_on:
      postgres:
        condition: service_healthy

      qdrant:
        condition: service_started

      redis:
        condition: service_healthy

    volumes:
      - uploads_data:/app/app/files/uploads
      - logs_data:/app/logs
      - mlruns_data:/app/mlruns

    networks:
      - atlas-network

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ==================== Celery Worker ====================
  celery_worker:
    image: ${ATLAS_IMAGE:-atlas-ai-api:local}
    container_name: atlas-celery-worker

    command: celery -A app.celery.celery_config worker --loglevel=info --concurrency=2

    environment:
      PYTHONUNBUFFERED: "1"

      # PostgreSQL
      POSTGRES_USER: ${POSTGRES_USER:-atlas_user}
      POSTGRES_PASS: ${POSTGRES_PASSWORD:-atlas_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-atlas_db}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

      # Qdrant
      QDRANT_URL: http://qdrant:6333

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-atlas_redis_password}

      # Celery broker and result backend
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-atlas_redis_password}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-atlas_redis_password}@redis:6379/1

      # Required secrets
      API_SECRET_KEY: ${API_SECRET_KEY:?Set API_SECRET_KEY in .env}

      # Internal service-to-service
      API_HOST: http://api:8000

      # External services
      JINA_API_KEY: ${JINA_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      REMOTE_EMBED_URL: ${REMOTE_EMBED_URL:-}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}

      # ==================== SMTP / Email ====================
      SMTP_SERVER: ${SMTP_SERVER:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}

      # Embedding provider
      ENVIRONMENT: ${ENVIRONMENT:-production}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-BAAI/bge-m3}

      # Observability
      SENTRY_DSN: ${SENTRY_DSN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEBUG: "${DEBUG:-False}"

    depends_on:
      postgres:
        condition: service_healthy

      qdrant:
        condition: service_started

      redis:
        condition: service_healthy

      api:
        condition: service_healthy

    volumes:
      - uploads_data:/app/app/files/uploads
      - logs_data:/app/logs
      - mlruns_data:/app/mlruns

    networks:
      - atlas-network

    restart: unless-stopped

    healthcheck:
      disable: true

  # ==================== Celery Beat ====================
  celery_beat:
    image: ${ATLAS_IMAGE:-atlas-ai-api:local}
    container_name: atlas-celery-beat

    command: celery -A app.celery.celery_config beat --loglevel=info

    environment:
      PYTHONUNBUFFERED: "1"

      # PostgreSQL
      POSTGRES_USER: ${POSTGRES_USER:-atlas_user}
      POSTGRES_PASS: ${POSTGRES_PASSWORD:-atlas_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-atlas_db}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

      # Qdrant
      QDRANT_URL: http://qdrant:6333

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-atlas_redis_password}

      # Celery broker and result backend
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-atlas_redis_password}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-atlas_redis_password}@redis:6379/1

      # Required secrets
      API_SECRET_KEY: ${API_SECRET_KEY:?Set API_SECRET_KEY in .env}

      # External services
      JINA_API_KEY: ${JINA_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      REMOTE_EMBED_URL: ${REMOTE_EMBED_URL:-}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}

      # ==================== SMTP / Email ====================
      SMTP_SERVER: ${SMTP_SERVER:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}

      # Embedding provider
      ENVIRONMENT: ${ENVIRONMENT:-production}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-BAAI/bge-m3}

      # Observability
      SENTRY_DSN: ${SENTRY_DSN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEBUG: "${DEBUG:-False}"

    depends_on:
      postgres:
        condition: service_healthy

      qdrant:
        condition: service_started

      redis:
        condition: service_healthy

      api:
        condition: service_healthy

    volumes:
      - logs_data:/app/logs
      - mlruns_data:/app/mlruns

    networks:
      - atlas-network

    restart: unless-stopped

    healthcheck:
      disable: true


# ==================== NETWORKS & VOLUMES ====================

networks:
  atlas-network:
    driver: bridge


# ==================== PERSISTENT VOLUMES ====================

volumes:
  postgres_data:
    driver: local

  qdrant_data:
    driver: local

  redis_data:
    driver: local

  uploads_data:
    driver: local

  logs_data:
    driver: local

  mlruns_data:
    driver: local