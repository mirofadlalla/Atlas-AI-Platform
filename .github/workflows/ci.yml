name: CI

on:
  pull_request:
    branches: [main]

  push:
    branches:
      - main
      - "fix/**"

permissions:
  contents: read

# ---------------------------------------------------------------------------
# Shared install helper
# ---------------------------------------------------------------------------
# Every job that needs Python packages calls these two steps in order:
#
#   1. Free runner disk space   — removes ~5 GB of pre-installed tools that
#                                 are never used by this project (Android SDK,
#                                 .NET, Haskell, etc.) so we have room for
#                                 the torch CPU wheel.
#
#   2. Resolve requirements.txt once with constraints-cpu.txt. The constraint
#      pins torch==2.4.1+cpu from the official CPU wheel index. The selected
#      sentence-transformers version has no torchvision dependency, removing
#      the prior path to a CUDA torchvision/torch pair.
#
# This mirrors exactly the Dockerfile builder stage strategy so CI and the
# production image use the same torch version.
# ---------------------------------------------------------------------------

jobs:
  # ---------------------------------------------------------------------------
  # 1. Lint & format
  # ---------------------------------------------------------------------------
  lint-and-format:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          echo "=== Disk before cleanup ==="
          df -h /
          # Remove large pre-installed tool sets that this project never uses.
          # Each removal is idempotent (|| true) so the step never fails.
          sudo rm -rf /usr/local/lib/android          || true  # ~5 GB Android SDK
          sudo rm -rf /usr/share/dotnet               || true  # ~2 GB .NET
          sudo rm -rf /opt/ghc                        || true  # ~1 GB Haskell GHC
          sudo rm -rf /usr/local/share/boost          || true  # ~1 GB Boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL     || true  # ~1 GB CodeQL
          sudo apt-get clean                          || true
          echo "=== Disk after cleanup ==="
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project dependencies with CPU-only PyTorch constraints
        run: |
          python -m pip install --upgrade pip "setuptools==80.10.1"
          python -m pip uninstall -y wheel
          pip install --no-cache-dir \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --constraint constraints-cpu.txt \
            -r requirements.txt
          python -m pip check

      - name: Verify CPU-only torch (no CUDA/NVIDIA packages)
        run: |
          python -c "
          import torch
          print('torch version:', torch.__version__)
          assert torch.__version__ == '2.4.1+cpu', \
            f'ERROR: unexpected torch build: {torch.__version__}'
          print('CUDA available:', torch.cuda.is_available())
          assert not torch.cuda.is_available(), 'CUDA should not be available on CI runner'
          from importlib.metadata import distributions
          dists = list(distributions())
          names = {d.metadata['Name'].lower() for d in dists}
          forbidden = sorted(
              name for name in names
              if name.startswith('nvidia-') or name == 'triton'
          )
          assert not forbidden, f'Unexpected GPU packages: {forbidden}'
          assert 'torchvision' not in names, 'Unexpected torchvision dependency'
          top_level_wheel = [
              str(d.locate_file('')) for d in dists
              if d.metadata['Name'].lower() == 'wheel'
              and '/setuptools/_vendor' not in str(d.locate_file(''))
          ]
          assert not top_level_wheel, f'Unexpected top-level wheel: {top_level_wheel}'
          print('OK — CPU-only torch confirmed')
          "

      - name: Check formatting (black)
        run: black --check app tests main.py

      - name: Lint (flake8)
        run: flake8 app tests main.py

  # ---------------------------------------------------------------------------
  # 2. Unit tests
  #
  # These tests must NOT require PostgreSQL, Redis, or Qdrant.
  # The env vars below satisfy Settings() validation at import time without
  # granting any real service access.
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    env:
      # Required by Settings() — test-only placeholders, no real service access
      API_SECRET_KEY: ci-unit-test-secret-not-for-production
      POSTGRES_PASS: ci-unit-test-pass
      POSTGRES_USER: ci_user
      POSTGRES_DB: ci_test
      POSTGRES_HOST: localhost
      # Groq SDK constructor does not validate the key; all LLM calls are
      # mocked in unit tests so an empty string is safe.
      GROQ_API_KEY: ""
      # Redis: ShortTermMemory fails open when Redis is unreachable, so unit
      # tests that don't explicitly test Redis are unaffected.
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      # Qdrant: SemanticMemory accepts injected clients in unit tests; real
      # Qdrant connectivity is not required.
      QDRANT_URL: http://localhost:6333

    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          echo "=== Disk before cleanup ==="
          df -h /
          sudo rm -rf /usr/local/lib/android          || true
          sudo rm -rf /usr/share/dotnet               || true
          sudo rm -rf /opt/ghc                        || true
          sudo rm -rf /usr/local/share/boost          || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL     || true
          sudo apt-get clean                          || true
          echo "=== Disk after cleanup ==="
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project dependencies with CPU-only PyTorch constraints
        run: |
          python -m pip install --upgrade pip "setuptools==80.10.1"
          python -m pip uninstall -y wheel
          pip install --no-cache-dir \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --constraint constraints-cpu.txt \
            -r requirements.txt
          python -m pip check

      - name: Run unit tests (excluding integration)
        run: pytest tests -q -m "not integration" --tb=short

  # ---------------------------------------------------------------------------
  # 3. Integration tests
  #
  # Spins up real PostgreSQL, Redis Stack, and Qdrant containers.
  # ---------------------------------------------------------------------------
  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: atlas_user
          POSTGRES_PASSWORD: atlas_test_password
          POSTGRES_DB: atlas_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U atlas_user -d atlas_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Using redis-stack-server (same image as docker-compose.yml) so that
      # any RedisStack modules (RediSearch, RedisJSON) are available.
      # Plain redis:7-alpine does NOT include these modules.
      redis:
        image: redis/redis-stack-server:7.2.0-v10
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Qdrant v1.17.0 is built on debian:12-slim and does NOT include curl
      # or wget in the final image.  A bash TCP-probe is the only reliable
      # in-container health check for this image.
      #
      # The TCP probe confirms port 6333 is accepting connections; the
      # step-level readiness check below additionally validates that Qdrant's
      # HTTP API is serving (using curl on the ubuntu-latest runner, which
      # always has curl available).
      qdrant:
        image: qdrant/qdrant:v1.17.0
        ports:
          - "6333:6333"
          - "6334:6334"
        options: >-
          --health-cmd "bash -c '</dev/tcp/localhost/6333'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15

    env:
      # Application configuration — values match the service containers above
      POSTGRES_USER: atlas_user
      POSTGRES_PASS: atlas_test_password
      POSTGRES_DB: atlas_test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      QDRANT_URL: http://localhost:6333
      API_SECRET_KEY: ci-integration-test-secret
      GROQ_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          echo "=== Disk before cleanup ==="
          df -h /
          sudo rm -rf /usr/local/lib/android          || true
          sudo rm -rf /usr/share/dotnet               || true
          sudo rm -rf /opt/ghc                        || true
          sudo rm -rf /usr/local/share/boost          || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL     || true
          sudo apt-get clean                          || true
          echo "=== Disk after cleanup ==="
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project dependencies with CPU-only PyTorch constraints
        run: |
          python -m pip install --upgrade pip "setuptools==80.10.1"
          python -m pip uninstall -y wheel
          pip install --no-cache-dir \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --constraint constraints-cpu.txt \
            -r requirements.txt
          python -m pip check

      # The bash TCP probe above guarantees port 6333 is open.
      # This step additionally confirms the HTTP REST API is live and
      # returning a valid response before we attempt migrations or tests.
      # curl is always available on ubuntu-latest runners.
      - name: Wait for Qdrant HTTP API to be ready
        run: |
          echo "Waiting for Qdrant HTTP API..."
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:6333/readyz > /dev/null 2>&1; then
              echo "Qdrant is ready (attempt ${attempt})"
              exit 0
            fi
            echo "  attempt ${attempt}/30 — retrying in 3s"
            sleep 3
          done
          echo "ERROR: Qdrant did not become ready within 90 seconds"
          exit 1

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run integration tests
        run: pytest tests -q -m integration --tb=short
