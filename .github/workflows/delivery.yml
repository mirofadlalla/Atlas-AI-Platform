name: Backend Delivery

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/atlas-ai

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build, security-scan, and publish image to GHCR
  # ---------------------------------------------------------------------------
  build-scan-push:
    name: Build, scan, and publish image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Free runner disk space (~20+ GB freed) ───────────────────────────
      # The default ubuntu-latest runner only has ~14-18 GB free. Unused
      # pre-installed toolchains are removed here so Docker build and Trivy
      # layer extraction have ample disk space.
      - name: Free runner disk space
        run: |
          echo "=== Disk before cleanup ==="
          df -h /
          sudo rm -rf /usr/local/lib/android          || true  # ~10 GB Android SDK
          sudo rm -rf /usr/share/dotnet               || true  # ~2.5 GB .NET
          sudo rm -rf /opt/ghc                        || true  # ~1.5 GB Haskell GHC
          sudo rm -rf /usr/local/share/boost          || true  # ~1 GB Boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL     || true  # ~1 GB CodeQL
          sudo docker image prune --all --force       || true  # Pre-cached images
          sudo apt-get clean                          || true
          echo "=== Disk after cleanup ==="
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine commit SHA and tags
        id: vars
        run: |
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "commit_sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "local_tag=atlas-ai-local:sha-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ steps.vars.outputs.commit_sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # ── Build ONCE, load to local daemon ─────────────────────────────────
      # platform linux/amd64 matches the EC2 t3.small (x86_64 / Intel Xeon).
      # Labels are applied here now since there's no second build to carry them.
      - name: Build image (linux/amd64, local daemon)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: ${{ steps.vars.outputs.local_tag }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # This runs before scanning or publishing. The model cache is placed in
      # the disposable container filesystem, so BGE-M3 is verified on CPU but
      # never becomes part of the published image layers.
      - name: Validate CPU-only PyTorch and BGE-M3 runtime
        run: |
          docker run --rm --entrypoint python \
            -e HF_HOME=/tmp/huggingface \
            "${{ steps.vars.outputs.local_tag }}" -c "
          from importlib.metadata import distributions, version
          from pathlib import Path
          from huggingface_hub import snapshot_download
          import torch
          from sentence_transformers import SentenceTransformer

          assert torch.__version__ == '2.4.1+cpu', torch.__version__
          assert torch.version.cuda is None
          assert not torch.cuda.is_available()
          print('ML package versions:', {
              package: version(package)
              for package in ('torch', 'transformers', 'sentence-transformers', 'safetensors')
          })
          dists = list(distributions())
          names = {d.metadata['Name'].lower() for d in dists}
          forbidden = sorted(
              name for name in names
              if name.startswith('nvidia-') or name == 'triton'
          )
          assert not forbidden, f'Unexpected GPU packages: {forbidden}'
          assert 'torchvision' not in names, 'Unexpected torchvision dependency'
          wheel_dists = [d for d in dists if d.metadata['Name'].lower() == 'wheel']
          print('wheel distributions:', [
              (d.version, str(d._path), str(d.locate_file('')), d.requires)
              for d in wheel_dists
          ])
          wheel_paths = [(d, str(d._path).replace(chr(92), '/')) for d in wheel_dists]
          top_level_wheel = [
              path for _, path in wheel_paths
              if '/setuptools/_vendor/' not in path
          ]
          assert not top_level_wheel, f'Unexpected top-level wheel dist-info: {top_level_wheel}'

          # BAAI/bge-m3 main currently exposes only pytorch_model.bin, which
          # correctly triggers Transformers' torch.load security guard on
          # torch<2.6. This immutable revision adds model.safetensors. Download
          # only the Sentence Transformers files needed for CPU encoding, then
          # load from that local safetensors-only directory.
          bge_safetensors_revision = '142964af7e05de16511657561de8e8750fc153a0'
          bge_model_dir = Path(snapshot_download(
              repo_id='BAAI/bge-m3',
              revision=bge_safetensors_revision,
              allow_patterns=[
                  '1_Pooling/config.json',
                  'config.json',
                  'config_sentence_transformers.json',
                  'model.safetensors',
                  'modules.json',
                  'sentence_bert_config.json',
                  'sentencepiece.bpe.model',
                  'special_tokens_map.json',
                  'tokenizer.json',
                  'tokenizer_config.json',
              ],
          ))
          assert (bge_model_dir / 'model.safetensors').is_file()
          assert not (bge_model_dir / 'pytorch_model.bin').exists()
          model = SentenceTransformer(str(bge_model_dir), device='cpu')
          assert str(model.device) == 'cpu'
          vector = model.encode(['Atlas-AI CPU runtime smoke test'])
          assert len(vector) > 0
          print('CPU-only PyTorch, Sentence Transformers, and BGE-M3 verified')
          "

      # ── Prune BuildKit cache to free disk space before Trivy export ───────
      # Since the image is already loaded in the Docker daemon, freeing BuildKit
      # cache gives Trivy plenty of room to export and unpack the image in /tmp.
      - name: Prune BuildKit cache
        run: |
          docker builder prune -f
          echo "=== Disk before Trivy scan ==="
          df -h /

      # ── Security scan BEFORE push ─────────────────────────────────────────
      - name: Scan image with Trivy (CRITICAL + HIGH)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.vars.outputs.local_tag }}
          format: table
          exit-code: "0"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      # ── Tag + push the ALREADY-BUILT image (no second build) ─────────────
      # Tagging and pushing the image that is already loaded in the local daemon
      # avoids a second buildx invocation and is faster than a full rebuild.
      - name: Tag and push image to GHCR
        run: |
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker tag "${{ steps.vars.outputs.local_tag }}" "$tag"
            docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"

  # ---------------------------------------------------------------------------
  # 2. Production deployment to EC2
  #
  # Runs ONLY on direct pushes to main (not PRs, not fix/** branches) so
  # that unreviewed code is never auto-deployed.
  #
  # Safety guarantees
  # ─────────────────
  # • Migrations run in a short-lived --rm container BEFORE the api service
  #   is recreated.  If migrations fail, the running api keeps serving traffic.
  # • Only `api` is recreated (--no-deps).  Postgres, Redis, Qdrant,
  #   Prometheus, and Grafana are never stopped or recreated.
  # • Previous ATLAS_IMAGE is written to .env.rollback before any change is
  #   made so ops can roll back with two commands.
  # • /health is polled for up to 120 s after the new container starts.
  #   If it never passes, the script automatically reverts the image tag in
  #   .env, restarts the old container, and exits non-zero.
  #
  # Required GitHub Actions secrets (Settings → Secrets → Actions)
  # ──────────────────────────────────────────────────────────────
  #   EC2_HOST     Public IP or hostname of the production EC2 instance.
  #   EC2_USER     SSH user on that instance (e.g. ec2-user or ubuntu).
  #   EC2_SSH_KEY  Full contents of the .pem private key file.
  #   GHCR_PAT     GitHub PAT with read:packages scope — used by docker pull
  #                on the EC2 host (GITHUB_TOKEN is a CI-only token and
  #                cannot be used from an external machine).
  # ---------------------------------------------------------------------------
  deploy-to-ec2:
    name: Deploy backend to EC2
    runs-on: ubuntu-latest
    needs: build-scan-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Compute image tag for this deploy
        id: image
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/atlas-ai:sha-${{ github.sha }}"
          echo "tag=${IMAGE}" >> "$GITHUB_OUTPUT"

      # ── Step 1-7: Rolling backend update ─────────────────────────────────
      - name: Deploy backend to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # script_stop: true causes the SSH session to fail as soon as any
          # command in the script returns a non-zero exit code.
          script_stop: true
          script: |
            set -euo pipefail

            DEPLOY_DIR="/home/${{ secrets.EC2_USER }}/atlas-deploy"
            NEW_IMAGE="${{ steps.image.outputs.tag }}"

            cd "${DEPLOY_DIR}"

            # ── 1. Save previous image tag for rollback ───────────────────
            echo "=== [1/7] Saving rollback information ==="
            PREV_IMAGE=$(grep '^ATLAS_IMAGE=' .env | cut -d= -f2- || echo "unknown")
            echo "Current (old) image: ${PREV_IMAGE}"
            echo "New image:           ${NEW_IMAGE}"
            # .env.rollback gives ops a single file with rollback instructions.
            cat > .env.rollback <<ROLLBACK_EOF
            # Auto-generated by GitHub Actions on $(date -u +"%Y-%m-%dT%H:%M:%SZ")
            # Rollback procedure:
            #   cd ${DEPLOY_DIR}
            #   sed -i "s|^ATLAS_IMAGE=.*|ATLAS_IMAGE=${PREV_IMAGE}|" .env
            #   docker compose --env-file .env up -d --no-deps api
            PREV_ATLAS_IMAGE=${PREV_IMAGE}
            ROLLBACK_EOF

            # ── 2. Authenticate to GHCR ───────────────────────────────────
            echo "=== [2/7] Logging in to GHCR ==="
            echo "${{ secrets.GHCR_PAT }}" \
              | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

            # ── 3. Pull the new image ─────────────────────────────────────
            echo "=== [3/7] Pulling: ${NEW_IMAGE} ==="
            docker pull "${NEW_IMAGE}"

            # ── 4. Run database migrations before cutover ─────────────────
            # Execute alembic upgrade head in a throwaway container that joins
            # atlas-network so it can reach atlas-postgres.
            # RUN_MIGRATIONS=false prevents the entrypoint from running
            # migrations a second time; we call alembic directly as the CMD.
            # If migrations fail this container exits non-zero, the script
            # aborts (set -e), and the live api container is never touched.
            echo "=== [4/7] Running database migrations ==="
            docker run --rm \
              --network atlas-network \
              --env-file "${DEPLOY_DIR}/.env" \
              -e RUN_MIGRATIONS=false \
              "${NEW_IMAGE}" \
              alembic upgrade head

            # ── 5. Update image tag in .env ───────────────────────────────
            echo "=== [5/7] Writing new image tag to .env ==="
            sed -i "s|^ATLAS_IMAGE=.*|ATLAS_IMAGE=${NEW_IMAGE}|" .env

            # ── 6. Recreate only atlas-api ────────────────────────────────
            # --no-deps: only the `api` service is recreated.
            # Postgres, Redis, Qdrant, Prometheus, and Grafana are untouched.
            echo "=== [6/7] Recreating atlas-api (--no-deps) ==="
            docker compose --env-file .env up -d --no-deps api

            # ── 7. Health-check the new container ─────────────────────────
            # Poll /health for up to 120 s (24 attempts × 5 s).
            # On timeout: revert .env, restart old image, exit 1.
            echo "=== [7/7] Health check (120 s budget) ==="
            for i in $(seq 1 24); do
              if curl -fsS http://localhost:8000/health > /dev/null 2>&1; then
                echo "Health check passed on attempt ${i} — deploy complete"
                exit 0
              fi
              echo "  attempt ${i}/24 — waiting 5 s..."
              sleep 5
            done

            echo "ERROR: /health never returned 200 within 120 seconds"
            echo "=== Auto-rolling back to: ${PREV_IMAGE} ==="
            sed -i "s|^ATLAS_IMAGE=.*|ATLAS_IMAGE=${PREV_IMAGE}|" .env
            docker compose --env-file .env up -d --no-deps api
            exit 1

      # ── Post-deploy verification ──────────────────────────────────────────
      - name: Verify deployment and confirm monitoring is untouched
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail

            echo "=== Running image on atlas-api ==="
            docker inspect atlas-api --format '{{.Config.Image}}'

            echo "=== /health endpoint ==="
            curl -fsS http://localhost:8000/health

            echo "=== Alembic current revision ==="
            docker exec atlas-api alembic current

            echo "=== Monitoring containers (must be running and unchanged) ==="
            docker ps \
              --filter name=atlas-prometheus \
              --filter name=atlas-grafana \
              --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"
